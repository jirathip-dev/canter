# CI for canter (public repository).
# Job names are STABLE contract: they become required-check contexts later.
# Do not rename jobs without a conductor-coordinated change.

name: ci

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      matrix_witness:
        description: 'Deliberately hang --lib and fail --bins; other suites run normally'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.matrix_witness || false }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Promotion policy (main PRs must come from staging; hotfix exception)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "promotion policy: not a pull_request event; pass"
            exit 0
          fi
          BASE_REF="${{ github.base_ref }}"
          HEAD_REF="${{ github.head_ref }}"
          if [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" = "staging" ]; then
              echo "promotion policy: staging -> main promotion PR; pass"
              exit 0
            fi
            case "$HEAD_REF" in
              hotfix/*)
                echo "::warning::HOTFIX exception engaged (hotfix/* PR to main): CI does NOT grant approval. This path requires fresh human approval, focused review, required CI, patch-release evidence, and mandatory main->staging reconciliation before promotion completes."
                exit 0
                ;;
              *)
                echo "::error::promotion policy: PRs to main must come from staging (or an incident/security hotfix/* branch); head branch is '${HEAD_REF}'"
                exit 1
                ;;
            esac
          fi
          echo "promotion policy: PR to staging; pass"

      - name: External-contributor distinction (fork PRs need human approval)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_REPO="${{ github.event.pull_request.head.repo.full_name }}"
            BASE_REPO="${{ github.repository }}"
            if [ -n "${HEAD_REPO}" ] && [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
              echo "::notice::EXTERNAL_CONTRIBUTOR — human maintainer approval required (fork PR; branch protection metadata is applied by repository maintainers, not by CI)"
            fi
          fi

      - name: Forbidden workflow-trigger spellings
        run: |
          set -euo pipefail
          TAIL="target"
          BAD="pull_request_${TAIL}"
          FILES=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print)
          if [ -z "$FILES" ]; then
            echo "::error::no workflow files found under .github/workflows"
            exit 1
          fi
          HITS=""
          for f in $FILES; do
            if grep -q "$BAD" "$f"; then
              echo "::error::$f contains the forbidden trigger spelling '$BAD'"
              HITS=1
            fi
          done
          if [ -n "$HITS" ]; then
            echo "::error::forbidden workflow triggers are not allowed in this repository"
            exit 1
          fi
          echo "forbidden-trigger scan: clean"

      - name: Action SHA pins (full 40-hex + same-line comment)
        run: |
          python3 - <<'PY'
          import glob
          import re
          import sys

          failures = []
          files = sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"))
          if not files:
              print("::error::no workflow files found")
              sys.exit(1)
          uses_re = re.compile(r"^\s*uses:\s+[^\s#@]+@([^\s#]+)")
          for path in files:
              for lineno, line in enumerate(open(path, encoding="utf-8"), start=1):
                  match = uses_re.match(line)
                  if not match:
                      continue
                  ref = match.group(1).strip()
                  if not re.fullmatch(r"[0-9a-f]{40}", ref):
                      failures.append(f"{path}:{lineno}: action ref '{ref}' is not a full 40-hex SHA")
                  elif "#" not in line:
                      failures.append(f"{path}:{lineno}: action pin lacks a human-readable '# comment' on the same line")
          if failures:
              for item in failures:
                  print(f"::error::{item}")
              sys.exit(1)
          print("action SHA-pin scan: clean")
          PY

      - name: Public-tree scanner self-test
        run: python3 scripts/test-check-public-tree.py

      - name: Public-tree scan (git-index privacy parser)
        run: python3 scripts/check-public-tree.py .

      - name: Required-files existence
        run: |
          set -euo pipefail
          required=(
            .github/CODEOWNERS
            .github/PULL_REQUEST_TEMPLATE.md
            .github/ISSUE_TEMPLATE/bug.yml
            .github/ISSUE_TEMPLATE/feature.yml
            .github/ISSUE_TEMPLATE/config.yml
            .github/workflows/ci.yml
            .github/workflows/security.yml
            .github/dependabot.yml
            src/lib.rs
            src/main.rs
            tests/cli_smoke.rs
            scripts/check-public-tree.py
            scripts/test-check-public-tree.py
            docs/ARCHITECTURE.md
            docs/DEVELOPMENT.md
            docs/WORKFLOW.md
            docs/RELEASING.md
            docs/decisions/0001-public-core-private-overlays.md
            docs/decisions/0002-staging-integration-main-release.md
            docs/decisions/0003-companion-boundary-and-harness-neutrality.md
            docs/architecture/README.md
            docs/architecture/herdr-fleet.locked-target.architecture.json
            docs/architecture/herdr-fleet.locked-target.architecture.html
            docs/architecture/herdr-fleet.locked-target.architecture.preview.light.png
            docs/architecture/herdr-fleet.locked-target.architecture.preview.dark.png
            skills/canter/SKILL.md
            SECURITY.md
            .editorconfig
            .gitignore
            AGENTS.md
            CHANGELOG.md
            CODE_OF_CONDUCT.md
            CONTRIBUTING.md
            Cargo.toml
            Cargo.lock
            deny.toml
            justfile
            LICENSE-APACHE
            LICENSE-MIT
            README.md
            rust-toolchain.toml
          )
          fail=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing required file: $f"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "required-files check: all present"

      - name: Documentation-link and README-contract check
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          import urllib.parse

          failures = []

          # README must link the architecture doc and every ADR (Amendment 1).
          readme = open("README.md", encoding="utf-8").read()
          for target in [
              "docs/ARCHITECTURE.md",
              "docs/decisions/0001-public-core-private-overlays.md",
              "docs/decisions/0002-staging-integration-main-release.md",
              "docs/decisions/0003-companion-boundary-and-harness-neutrality.md",
          ]:
              pattern = re.compile(r"\[[^\]]*\]\(\s*" + re.escape(target) + r"\s*\)")
              if not pattern.search(readme):
                  failures.append(f"README.md must link {target}")

          link_re = re.compile(r"(?<!!)\[[^\]]*\]\(([^)]+)\)")
          files = ["README.md"]
          for dirpath, _dirnames, filenames in os.walk("docs"):
              for name in sorted(filenames):
                  if name.endswith(".md"):
                      files.append(os.path.join(dirpath, name))

          for path in sorted(files):
              try:
                  text = open(path, encoding="utf-8").read()
              except OSError as exc:
                  failures.append(f"{path}: unreadable ({exc})")
                  continue
              base = os.path.dirname(path) or "."
              for lineno, line in enumerate(text.splitlines(), start=1):
                  for target in link_re.findall(line):
                      target = target.strip()
                      if not target or target.startswith(("#", "http://", "https://", "mailto:", "data:")):
                          continue
                      if target.startswith("http"):
                          continue
                      target = target.split("#", 1)[0]
                      if not target:
                          continue
                      target = urllib.parse.unquote(target)
                      resolved = os.path.normpath(os.path.join(base, target))
                      if not os.path.isfile(resolved):
                          failures.append(f"{path}:{lineno}: broken link -> {target}")

          if failures:
              for item in failures:
                  print(f"::error::{item}")
              sys.exit(1)
          print("documentation-link check: clean")
          PY

      - name: Integration branch exists (staging guard)
        run: |
          set -euo pipefail
          if ! REF="$(git ls-remote origin refs/heads/staging)"; then
            echo "::error::staging guard: 'git ls-remote origin refs/heads/staging' failed; cannot verify the integration branch"
            exit 1
          fi
          if [ -z "$REF" ]; then
            echo "::error::staging guard: integration branch 'staging' is MISSING on origin (delete_branch_on_merge deleted it after a promotion, or it was removed manually). Restore it per docs/OPERATIONS.md section 8.1 and re-check the auto-delete-head-branches repository setting is OFF before merging."
            exit 1
          fi
          echo "staging guard: refs/heads/staging exists on origin ($REF)"

  rust-ubuntu-build:
    name: rust-ubuntu-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      # Formatting gate runs FIRST, before any download/compile of the crate.
      - name: Format check
        run: cargo fmt --check

      - name: Locked check (all targets)
        run: cargo check --locked --all-targets

      - name: Clippy (warnings denied)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build test executables
        id: test-build
        timeout-minutes: 5
        run: cargo test --locked --no-run

      - name: Test driver regression checks
        id: driver-checks
        timeout-minutes: 3
        run: |
          python3 scripts/test-ci-test-driver.py
          python3 scripts/test-ci-test-scope.py

      # Preserve source and build mtimes together so downstream cargo reuses
      # the hoisted build. Only tracked sources and target are archived, not .git.
      - name: Package test build
        run: |
          git ls-files -z > "$RUNNER_TEMP/test-sources"
          tar --format=posix --exclude=target/debug/incremental -cf "$RUNNER_TEMP/test-build.tar" --null -T "$RUNNER_TEMP/test-sources" target

      - name: Upload test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-ubuntu-test-build
          path: ${{ runner.temp }}/test-build.tar
          if-no-files-found: error
          retention-days: 1

      - name: Docs
        run: cargo doc --locked --no-deps

      - name: Release build
        run: cargo build --release --locked

  # Refs #136: a wedged runner cannot hide the suite's job identity.
  rust-ubuntu-suite:
    name: rust-ubuntu (${{ matrix.suite }})
    needs: rust-ubuntu-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        suite: [
          "--lib",
          "--bins",
          "--test board_read_model",
          "--test checkpoint",
          "--test cli_readonly",
          "--test cli_smoke",
          "--test commands",
          "--test daemon_lifecycle",
          "--test daemon_rpc",
          "--test executor_authoring",
          "--test executor_lifecycle",
          "--test frontier_carry_forward",
          "--test grant_issue",
          "--test handoff_crash_acceptance",
          "--test harness_adapters",
          "--test herdr_compatibility",
          "--test herdr_pane_execution",
          "--test lane_cli",
          "--test lane_replacement",
          "--test mutation_engine",
          "--test no_network_surface",
          "--test profile_binding",
          "--test queue_advance",
          "--test queue_cli",
          "--test queue_preview",
          "--test queue_submit",
          "--test redact_scale",
          "--test rename_compat",
          "--test rename_sweep",
          "--test restart_pause_continuity",
          "--test retirement",
          "--test review_dispatch",
          "--test run_control",
          "--test run_control_cli",
          "--test service_plans",
          "--test start_adopt",
          "--test supervision",
          "--test supervision_dispatch_refusal",
          "--test tui_board",
          "--test tui_live_wiring",
          "--test tui_operator",
          "--test tui_supervision",
          "--doc"
        ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Download test build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rust-ubuntu-test-build
          path: ${{ runner.temp }}

      - name: Restore test build
        run: |
          tar -xf "$RUNNER_TEMP/test-build.tar"
          git diff --exit-code

      - name: Install deliberate matrix witness
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.matrix_witness }}
        run: python3 scripts/ci-matrix-witness.py

      - name: Tests group
        timeout-minutes: 4
        env:
          SUITE: ${{ matrix.suite }}
          LOG_DIR: ${{ runner.temp }}/canter-test-group
        run: python3 -u scripts/ci-test-scope.py --seconds 200 --log-dir "$LOG_DIR" -- python3 -u scripts/ci-test-driver.py --suite="$SUITE" --aggregate-seconds 180 --per-suite-seconds 150

      - name: Upload group diagnostics
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-ubuntu-tests-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canter-test-group
          if-no-files-found: error
          retention-days: 7

  # Preserve the stable required-check name; skipped/cancelled is not success.
  rust-ubuntu:
    name: rust-ubuntu
    needs: [rust-ubuntu-build, rust-ubuntu-suite]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every suite and build to pass
        env:
          BUILD_RESULT: ${{ needs.rust-ubuntu-build.result }}
          SUITE_RESULT: ${{ needs.rust-ubuntu-suite.result }}
        run: |
          printf 'build=%s suites=%s\n' "$BUILD_RESULT" "$SUITE_RESULT"
          test "$BUILD_RESULT" = success
          test "$SUITE_RESULT" = success

  rust-macos:
    name: rust-macos
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Locked build (all targets)
        run: cargo build --locked --all-targets

      - name: Real CLI smoke (exit codes asserted)
        run: |
          set -euo pipefail
          BIN="target/debug/canter"
          "$BIN" --help > /tmp/hf-help.txt
          "$BIN" -h > /tmp/hf-help-short.txt
          "$BIN" --version > /tmp/hf-version.txt
          "$BIN" -V > /tmp/hf-version-short.txt
          if [ ! -s /tmp/hf-help.txt ] || ! grep -q "USAGE" /tmp/hf-help.txt; then
            echo "::error::--help output missing usage text"
            exit 1
          fi
          if ! grep -q "canter" /tmp/hf-version.txt || ! grep -q "0.1.0" /tmp/hf-version.txt; then
            echo "::error::--version output missing package identity"
            exit 1
          fi
          if "$BIN" --definitely-not-a-command > /dev/null 2>&1; then
            echo "::error::unknown argument must exit non-zero"
            exit 1
          fi
          if "$BIN" > /dev/null 2>&1; then
            echo "::error::no arguments must exit non-zero"
            exit 1
          fi
          # The pre-rename alias binary ships and runs the same CLI
          # (docs/contracts/compatibility.md, "Product rename (issue #106)").
          LEGACY="target/debug/herdr-fleet"
          if [ ! -x "$LEGACY" ]; then
            echo "::error::pre-rename alias binary was not built"
            exit 1
          fi
          "$LEGACY" --version > /tmp/hf-legacy-version.txt 2>/tmp/hf-legacy-warning.txt
          if ! grep -q "canter" /tmp/hf-legacy-version.txt; then
            echo "::error::alias --version output missing the canter identity"
            exit 1
          fi
          if ! grep -q "pre-rename" /tmp/hf-legacy-warning.txt; then
            echo "::error::alias must warn about the pre-rename name on stderr"
            exit 1
          fi
          echo "CLI smoke: help/version/unknown/no-args all asserted"

      - name: Locked tests
        run: cargo test --locked
