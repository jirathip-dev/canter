[package]
name = "canter"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
description = "Typed, plan-first CLI companion for operating Herdr coding-agent fleets (pre-alpha scaffold)."
repository = "https://github.com/jirathip-dev/canter"
readme = "README.md"
license = "Apache-2.0 OR MIT"

# The canonical binary is `canter`, built from `src/main.rs`. `herdr-fleet`
# is the pre-rename product name: it stays available as a compatibility
# alias that runs the same CLI (docs/contracts/compatibility.md, "Product
# rename (issue #106)").
[[bin]]
name = "herdr-fleet"
path = "src/bin/herdr-fleet.rs"

[dependencies]
# Read-only core (issue #4): TOML parsing for hf-config/hf-policy documents,
# SHA-256 for deterministic plan digests/acceptance revisions, and serde for
# the typed TOML decode path. No async/HTTP/clap/tracing dependencies: the
# core is stdlib-first and spawns only bounded child processes.
serde = "1"
sha2 = "0.11"
toml = "1.1"

# Daemon foundation (issue #5): bundled SQLite is the daemon-owned state
# authority (leases, idempotency claims, journals, audit, epochs, recovery);
# fs2 provides the cross-platform advisory file lock (flock) that makes the
# daemon a single-writer process with stale-process recovery. Both are
# permissive-licensed and used only where the slice proves need.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
fs2 = "0.4.3"
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29.0"

[dev-dependencies]
# Reference JSON parser used only to cross-check the crate's own strict
# parser/canonical writer against the committed #3 fixture corpus.
serde_json = "1"
